name: Actualizar Cursos JSON

on:
  schedule:
    - cron: '0 0 * * *' # Ejecutar diariamente a la medianoche UTC
  workflow_dispatch: # Permitir ejecución manual desde la pestaña Actions de GitHub

jobs:
  update-courses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Script de Actualización de Cursos
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          python scripts/update_courses.py

      - name: Hacer Commit y Push de los cambios en JSONs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualización automática de datos de cursos JSON [skip ci]"
          file_pattern: "public/data/courses/*.json"
